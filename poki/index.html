      // Claw stays visible — it drifts back to its idle hang in
      // the idle branch above.
      reticleGroup.visible = false;
      S.nextHandAt = S.t + S.hand.cooldownMs;
    }
  }
}

// ============================================================
// ELIMINATION + GAME PROGRESS
// ============================================================
function eliminate(f, reason) {
  if (!f.alive) return;
  f.alive = false;
  S.alive--;
  S.eliminated.push({ id: f.id, isPlayer: f.isPlayer, reason, atMs: S.t });
  DRIFT.onDeath();
  DRIFT.farewell(f.def && f.def.type, f.x / Math.max(0.01, S.plateR), f.z / Math.max(0.01, S.plateR));
  KAOSS.death(f.x, f.z);
  if (f.isPlayer) {
    // SPLAT sign + a beat of spectating before results.
    const splat = document.getElementById('splat');
    splat.querySelector('.l2').textContent =
      reason === 'fell' ? 'you fell' : reason === 'drained' ? 'you cracked' : 'the claw got you';
    splat.classList.add('on');
    screenShake(0.30, 500);
    setTimeout(() => splat.classList.remove('on'), 1400);
  }
  // Attract mode: no results screen; the bots just play again.
  if (S.attract) {
    if (S.alive <= 1) setTimeout(() => { if (S.attract) reset(false); }, 1800);
    return;
  }
  // End the round when the player is out (their placement is already
  // locked in by elimination order) or when only one figure remains
  // (the last survivor wins).
  if (f.isPlayer || S.alive <= CFG.podiumCount) {
    endGame();
  }
}

function endGame() {
  if (S.phase === 'over') return;
  S.phase = 'over';
  Poki.gameplayStop();
  hideStick();

  // Placement by elimination order: first out placed 10th, last
  // figure standing placed 1st.
  let placement;
  if (S.player && S.player.alive) {
    placement = 1;
  } else {
    const idx = S.eliminated.findIndex(e => e.isPlayer);
    placement = CFG.startCount - idx;
  }

  const won = placement === 1;
  if (won) {
    saveWin();
    DRIFT.fanfare();
    screenShake(0.42, 900);
    if (discoBall) discoSpin = 10;   // party spin-up
  }
  DRIFT.stop(1.2);
  // Results panel waits so the death splat / win party stays visible.
  setTimeout(() => showOverlay(placement), won ? 1800 : 1500);
}

function showHint(text) {
  const h = document.getElementById('hint');
  h.textContent = text;
  h.classList.add('on');
  clearTimeout(showHint._t);
  showHint._t = setTimeout(() => h.classList.remove('on'), 1600);
}

function showOverlay(placement) {
  const o = document.getElementById('over');
  const ord = document.getElementById('ord');
  const stat = document.getElementById('overStat');
  const ords = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th'];
  ord.textContent = ords[placement - 1] || (placement + 'th');
  ord.className = 'ord' + (placement === 1 ? ' win' : '');
  o.classList.toggle('winner', placement === 1);
  const sec = Math.floor(S.t / 1000);
  const mm = String(Math.floor(sec / 60)).padStart(2, '0');
  const ss = String(sec % 60).padStart(2, '0');
  stat.textContent = `survived ${mm}:${ss}`;
  o.classList.add('show');
}

// ============================================================
// SHRINK
// ============================================================
function maybeShrink(dt) {
  if (S.t < S.nextShrinkAt) return;
  const newR = Math.max(CFG.shrinkMin, S.plateR * CFG.shrinkFactor);
  S.plateR = newR;
  const targetScale = newR / CFG.plateR0;
  shrinkTween = { from: plateMesh.scale.x, to: targetScale, t: 0, dur: 0.6 };
  S.nextShrinkAt = S.t + CFG.shrinkEveryMs;
  DRIFT.thicken();
  KAOSS.shrinkPulse();
  showHint('the shape shrinks');
}

let shrinkTween = null;
function tickShrinkTween(dt) {
  if (!shrinkTween) return;
  shrinkTween.t += dt;
  const k = Math.min(1, shrinkTween.t / shrinkTween.dur);
  const e = 1 - (1 - k) * (1 - k);
  const s = lerp(shrinkTween.from, shrinkTween.to, e);
  plateMesh.scale.set(s, 1, s);
  plateCollar.scale.set(s, 1, s);
  reticleGroup.scale.set(1, 1, 1);
  if (k >= 1) shrinkTween = null;
}

// ============================================================
// HUD
// ============================================================
const hudStatus = document.getElementById('hud-status');
const hpRowEl = document.getElementById('hud-hp');
const hpPipsDom = [];
for (let i = 0; i < CFG.hpMax; i++) {
  const pip = document.createElement('span');
  pip.className = 'hp-pip';
  pip.textContent = '\u2764\uFE0F';
  hpRowEl.appendChild(pip);
  hpPipsDom.push(pip);
}

function updateHud() {
  hudStatus.textContent = S.alive + ' alive';
  if (S.player) {
    const hp = Math.max(0, S.player.hp);
    for (let i = 0; i < CFG.hpMax; i++) {
      hpPipsDom[i].classList.toggle('dead', i >= hp);
    }
  }
}

// ============================================================
// AMBIENT SCENE TICKS — tunnel rings, disco ball, accent pulses.
// Always running so the void looks alive on title/over screens too.
// ============================================================
function tickAmbient(dt, tSec) {
  // glass floor breathes faintly so it isn't dead
  plateTopMat.emissiveIntensity = 0.05 + Math.sin(tSec * 1.8) * 0.03;
  // edge strip pulses brightness so the silhouette stays alive
  plateEdgeStrip.material.opacity = 0.85 + Math.sin(tSec * 1.4) * 0.10;

  for (let i = 0; i < tunnelRings.length; i++) {
    const tr = tunnelRings[i];
    tr.mesh.rotation.z += dt * tr.spinRate * tr.spinSign;
    const pulse = 1 + Math.sin(tSec * 1.4 + tr.phase) * 0.06;
    tr.mesh.scale.set(pulse, pulse, 1);
    tr.mesh.material.opacity = 0.78 + Math.sin(tSec * 1.8 + tr.phase * 1.3) * 0.10;
  }
  // giant solid shapes tumble on all three axes, breathing opacity
  // around their per-shape base value
  for (let i = 0; i < giantShapes.length; i++) {
    const g = giantShapes[i];
    g.mesh.rotation.x += dt * g.spin.x;
    g.mesh.rotation.y += dt * g.spin.y;
    g.mesh.rotation.z += dt * g.spin.z;
    g.mat.opacity = g.baseOpacity + Math.sin(tSec * 1.3 + g.phase) * 0.08;
  }
  if (discoBall) {
    // let it roll — tumble on all three axes so it never settles.
    // discoSpin decays back to 1 after the win party spin-up.
    discoSpin += (1 - discoSpin) * Math.min(1, dt * 0.45);
    discoBall.rotation.y += dt * 1.45 * discoSpin;
    discoBall.rotation.x += dt * 0.62 * discoSpin;
    discoBall.rotation.z += dt * 0.83 * discoSpin;
  }
  // accent lights slowly drift in intensity so the room breathes
  accentRed.intensity     = 0.90 + Math.sin(tSec * 0.9)       * 0.28;
  accentBlue.intensity    = 0.82 + Math.sin(tSec * 0.7 + 1.4) * 0.26;
  accentMagenta.intensity = 0.65 + Math.sin(tSec * 1.1 + 2.6) * 0.22;
  accentCyan.intensity    = 0.65 + Math.sin(tSec * 0.85 + 0.6) * 0.22;
  accentOrange.intensity  = 0.55 + Math.sin(tSec * 1.2 + 3.8) * 0.20;

  // light beams sway like an unseen lighting rig is working the room
  for (let i = 0; i < lightBeams.length; i++) {
    const b = lightBeams[i];
    b.mesh.rotation.z = Math.sin(tSec * 0.6 + b.phase) * 0.18;
    b.mesh.rotation.x = Math.cos(tSec * 0.5 + b.phase * 1.3) * 0.16;
    b.mesh.material.opacity = b.baseOpacity * (0.75 + Math.sin(tSec * 1.6 + b.phase) * 0.25);
  }
}

// ============================================================
// MAIN LOOP
// ============================================================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const tSec = now / 1000;

  pollKeys();
  if (S.phase === 'play') {
    S.t = now - S.startedAt;
    updateTilt(dt);
    updateFigures(dt);
    if (S.hand.phase === 'idle' && S.t >= S.nextHandAt && S.alive > CFG.podiumCount) {
      startHand();
    }
    updateHand(dt);
    tickHearts(dt);
    maybeShrink(dt);
    tickShrinkTween(dt);
    if (!S.attract) updateHud();
  } else if (S.phase === 'over') {
    updateTilt(dt);
    updateFigures(dt);
    updateHand(dt);
    tickShrinkTween(dt);
    updateHud();
  } else if (S.phase === 'countdown') {
    // Everyone frozen — figures hold their spawn spots, no physics,
    // no bot AI, no damage. Only the claw's idle sway keeps moving.
    updateHand(dt);
  }

  // Feed the ambient effector: plate tilt is the master knob, the
  // player's slide speed + edge-closeness add tension on top.
  {
    const tiltMag = Math.min(1, Math.hypot(S.tilt.x, S.tilt.z) / CFG.maxTilt);
    let speed = 0, edge = 0;
    if (S.player && S.player.alive) {
      speed = Math.min(1, Math.hypot(S.player.vx, S.player.vz) / 6);
      edge = Math.min(1, Math.hypot(S.player.x, S.player.z) / Math.max(0.01, S.plateR));
    }
    DRIFT.setTilt(S.tilt.x / CFG.maxTilt, S.tilt.z / CFG.maxTilt, tiltMag, speed, edge);
    // Crowd energy: mean slide speed of everyone still standing.
    let crowd = 0, aliveN = 0;
    for (const f of S.figs) {
      if (!f.alive || f.picked || f.dropping || f.draining) continue;
      crowd += Math.min(1, Math.hypot(f.vx, f.vz) / 6);
      aliveN++;
    }
    DRIFT.setCrowd(aliveN ? crowd / aliveN : 0);
    // Claw telegraph: rising shimmer synced to the reticle fill.
    const k = (S.hand.phase === 'telegraph')
      ? Math.min(1, S.hand.t / CFG.handTelegraphMs) : 0;
    DRIFT.telegraph(k);
    if (k > 0) KAOSS.telegraph(S.hand.x, S.hand.z, k);
    KAOSS.tick(dt, S.tilt.x / CFG.maxTilt, S.tilt.z / CFG.maxTilt,
               tiltMag, DRIFT.state().chordIdx, tSec);
  }

  tickAmbient(dt, tSec);
  tickConfetti(dt);
  fitCameraTarget();
  tickCamera(dt);
  SHELL.setCameraBase(camera, camera.position.x, camera.position.y, camera.position.z);
  tickShake(now);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ============================================================
// START / RESET
// ============================================================
function reset(withPlayer) {
  for (const f of S.figs) {
    if (f.mesh.parent) f.mesh.parent.remove(f.mesh);
  }
  S.figs = [];
  S.player = null;
  S.alive = 0;
  S.eliminated = [];
  S.podium = [];
  S.t = 0;
  S.startedAt = performance.now();
  S.plateR = CFG.plateR0;
  plateMesh.scale.set(1, 1, 1);
  plateCollar.scale.set(1, 1, 1);
  S.nextShrinkAt = CFG.shrinkEveryMs;
  S.nextHandAt = 4500;
  S.firstHand = true;
  S.hand = { phase: 'idle', t: 0, x: 0, z: 0, zoneR: 0, target: null, captured: [] };
  S.tilt = { x: 0, z: 0 };
  // Claw stays visible across resets — idle hang above the plate.
  handGroup.visible = true;
  handGroup.position.set(0, CFG.handIdleY, 0);
  handGroup.rotation.set(0, 0, 0);
  reticleGroup.visible = false;
  shrinkTween = null;
  camInitialized = false;
  clearHearts();
  spawnFigures(withPlayer);
  S.attract = !withPlayer;
  S.phase = withPlayer ? 'countdown' : 'play';
  if (withPlayer) {
    // blow the walls outward as the first real round begins — the room
    // scatters, gameplay happens in the cleared void above. Idempotent.
    explodeRoom();
  }
  const over = document.getElementById('over');
  over.classList.remove('show', 'winner');
}

// ============================================================
// GAME FLOW — menu / countdown / round / results, wired through the
// studio shell. The menu shows the bots playing behind the panel.
// ============================================================
function playerHitFX() {
  // Small shake + a "-1 💔" pop at screen center. Rate-limited by the
  // i-frame window (this only fires when damage actually applied).
  screenShake(0.16, 280);
  const pop = document.getElementById('tile-popup');
  pop.textContent = '-1 \u{1F494}';
  pop.style.color = '#ff5a3c';
  pop.style.transition = 'none';
  pop.style.opacity = '1';
  pop.style.transform = 'translate(-50%, -50%) scale(1.1)';
  requestAnimationFrame(() => {
    pop.style.transition = 'opacity 0.7s ease-out, transform 0.7s ease-out';
    pop.style.opacity = '0';
    pop.style.transform = 'translate(-50%, -60%) scale(0.9)';
  });
}

function playerHealFX() {
  const pop = document.getElementById('tile-popup');
  pop.textContent = '+1 \u2764\uFE0F';
  pop.style.color = '#5bff7a';
  pop.style.transition = 'none';
  pop.style.opacity = '1';
  pop.style.transform = 'translate(-50%, -50%) scale(1.1)';
  requestAnimationFrame(() => {
    pop.style.transition = 'opacity 0.7s ease-out, transform 0.7s ease-out';
    pop.style.opacity = '0';
    pop.style.transform = 'translate(-50%, -40%) scale(0.9)';
  });
}

function showMenu() {
  document.body.classList.add('in-menu');
  document.getElementById('menu').classList.add('show');
  document.getElementById('over').classList.remove('show', 'winner');
  document.getElementById('menu-wins').textContent =
    loadWins() > 0 ? ('wins: ' + loadWins()) : '';
  hideStick();
  if (S.attract !== true || S.phase !== 'play') reset(false);
}

function startRound() {
  document.body.classList.remove('in-menu');
  document.getElementById('menu').classList.remove('show');
  reset(true);
  updateHud();
  // 3-2-1-go over frozen figures; the menu ambient fades out across
  // the count so silence lands just before "go".
  DRIFT.stop(2.7);
  const cd = document.getElementById('countdown');
  const steps = ['3', '2', '1', 'go!'];
  let i = 0;
  cd.classList.add('on');
  const step = () => {
    if (i < steps.length) {
      cd.textContent = steps[i++];
      setTimeout(step, i === steps.length ? 550 : 900);
    } else {
      cd.classList.remove('on');
      S.phase = 'play';
      S.startedAt = performance.now();
      Poki.gameplayStart();
      DRIFT.roundStart();
      if (isTouchDevice()) showStickAtRest();
    }
  };
  step();
}

function isTouchDevice() {
  return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
}

document.getElementById('btn-play').addEventListener('click', startRound);
document.getElementById('btn-again').addEventListener('click', () => {
  // PLAY AGAIN is the ad slot: everything mutes during the break.
  Poki.commercialBreak().then(startRound);
});
document.getElementById('btn-back').addEventListener('click', () => {
  showMenu();
  DRIFT.start();
});
document.getElementById('btn-howto').addEventListener('click', () => {
  document.getElementById('howto-modal').classList.add('show');
});

// ============================================================
// SHELL INTEGRATION — boot choreography, audio unlock, boombox
// mute prop, splash readiness.
// ============================================================
SHELL.init({
  storageKey: 'shapestore.wins',
  bbAssets: { boombox: './boombox.glb', tape: './tape.glb' },
  isMenu: () => S.phase === 'play' && S.attract || document.getElementById('menu').classList.contains('show'),
  isPlaying: () => S.phase === 'play' && !S.attract,
  onBoot: () => {
    DRIFT.ensure();
    Poki.init().then(() => {
      const poll = setInterval(() => {
        if (document.body.classList.contains('game-ready')) {
          clearInterval(poll);
          Poki.gameLoadingFinished();
        }
      }, 150);
    });
    document.getElementById('howto-modal').classList.add('show');
    showMenu();
  },
  onFirstGesture: () => { DRIFT.unlock(); },
  isAudioUnlocked: () => DRIFT.running(),
  onMenuWake: () => { DRIFT.start(); },
  onUserMute: (m) => { DRIFT.setUserMuted(m); },
  onAdMute: (m) => { DRIFT.setMuted(m); },
  splashParts: [
    () => discoLoaded,
    () => DRIFT.ready(),
  ],
});

requestAnimationFrame(loop);


</script>
