<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ten little</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Press Start 2P: classic NES-pixel font for headlines + buttons.
     VT323: pixel terminal monospace for HUD + body. -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #14110d;
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
  }
  body {
    /* VT323 (pixel terminal) for body / HUD informational text;
       Press Start 2P for headlines + buttons. Both loaded above. */
    font-family: 'VT323', monospace;
    color: #ffffff;
    font-size: 16px;
    font-style: normal;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  body, body * { font-style: normal !important; }
  button { -webkit-tap-highlight-color: transparent; }
  canvas#c { display: block; position: fixed; inset: 0; width: 100%; height: 100dvh; }

  /* (SoundCloud iframe removed — back to HTML5 <audio> element) */

  /* Boombox + tape mini-scene, fixed in the bottom-left corner.
     The user drags the tape onto the boombox to start the music
     and taps the boombox to pause + eject the tape. Stays out of
     the joystick's way (joystick sits bottom-right on mobile). */
  #bb-canvas {
    position: fixed; z-index: 30;
    bottom: calc(env(safe-area-inset-bottom) + 8px);
    left: calc(env(safe-area-inset-left) + 8px);
    width: 365px; height: 265px;
    /* Pointer events are handled at document level (see
       bindBoomboxPointerEvents) so that empty canvas areas don't
       intercept touches meant for the joystick or game UI. */
    pointer-events: none;
    touch-action: none;
    cursor: default;
  }
  body.bb-grabbable { cursor: grab; }
  body.bb-grabbing  { cursor: grabbing; }
  @media (max-width: 520px) {
    #bb-canvas { width: 295px; height: 215px; }
  }

  /* grain overlay */
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.45'/></svg>");
    mix-blend-mode: overlay; opacity: 0.16;
  }

  /* HUD — two rows.
       Row 1 (centered, top): the two numeric stats — alive, round.
       Row 2 (centered, just below): the health row, big & spread. */
  .hud {
    position: fixed; z-index: 10; pointer-events: none;
    color: #ffffff;
  }
  #hud-bar {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 62px);
    left: 50%;
    transform: translateX(-50%);
    display: flex; align-items: center; flex-wrap: nowrap; gap: 16px;
    font-family: 'VT323', monospace;
    font-size: 26px; line-height: 1;
    white-space: nowrap;
    max-width: calc(100vw - 32px);
  }
  #hud-bar .stat {
    display: inline-flex; align-items: center; gap: 8px;
    color: #ffffff;
  }
  #hud-bar .label {
    font-family: 'VT323', monospace;
    font-size: 22px;
    opacity: 0.75;
  }
  #hud-bar .val {
    font-family: 'VT323', monospace;
    font-size: 30px;
  }
  #hud-bar .dim { opacity: 0.55; }
  #hud-bar .sep { opacity: 0.45; font-size: 24px; }

  /* Big HP row: at the very top, screen-wide, glyphs large. */
  #hud-hp {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 14px);
    left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 14px;
    pointer-events: none;
  }
  #hud-hp .hp-label {
    font-family: 'VT323', monospace;
    font-size: 24px;
    color: #ffffff;
    opacity: 0.75;
  }
  /* Health: row of pixel-heart icons (gay.png). All pips identical;
     dead pips dim out, i-frame pips brighten. */
  .hp-row {
    display: flex; align-items: center; justify-content: center;
    gap: 14px;
    line-height: 1;
  }
  .hp-pip {
    display: inline-block;
    width: 36px; height: 36px;
    background: url('./gay.png') no-repeat center / contain;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    transition: opacity 0.15s, filter 0.15s;
  }
  .hp-pip.dead {
    opacity: 0.18;
    filter: grayscale(0.7);
  }
  .hp-pip.iframe {
    filter: brightness(2.0) saturate(0.5);
  }

  /* tilt indicator */
  #tilt {
    position: fixed; bottom: calc(env(safe-area-inset-bottom) + 22px); left: 50%; transform: translateX(-50%);
    width: 64px; height: 64px; z-index: 10; pointer-events: none;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 50%;
  }
  #tilt::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);
    border-radius: 50%;
  }
  #tilt-arrow {
    position: absolute; top: 50%; left: 50%;
    width: 2px; height: 26px; background: #ff1a1a;
    transform-origin: 50% 100%;
    transform: translate(-50%, -100%) rotate(0deg);
    transition: transform 0.05s linear;
  }
  #tilt-arrow::before {
    content: ''; position: absolute; top: -3px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-bottom: 6px solid #ff1a1a;
  }
  #tilt-label {
    position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%);
    font-family: 'VT323', monospace;
    font-size: 12px;
    color: #ffffff; opacity: 0.50; white-space: nowrap;
    font-style: normal;
  }

  /* title at intro — two lines stacked, each letter a different
     primary from the palette, big chunky pixel signage in Press
     Start 2P. */
  #title {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 20;
    background: rgba(20,17,13,0.55);
    transition: opacity 0.6s ease;
  }
  #title h1 {
    font-family: 'Press Start 2P', monospace;
    font-weight: 400; font-style: normal;
    font-size: clamp(36px, 9vw, 96px);
    text-align: center;
    text-transform: lowercase;
    line-height: 1.25;
    margin: 0;
    letter-spacing: 0.04em;
  }
  #title h1 .line { display: block; }
  /* 'little' (6 chars) is the visual-width reference. Spread the
     shorter words so all three lines align in width. */
  #title h1 .line-ten    { letter-spacing: 0.95em; padding-left: 0.95em; }
  #title h1 .line-little { letter-spacing: 0.04em; padding-left: 0.04em; }
  #title h1 .line-nigas  { letter-spacing: 0.30em; padding-left: 0.30em; }
  /* per-letter primary palette colors */
  #title h1 .c0  { color: #ff1a1a; } /* red */
  #title h1 .c1  { color: #1a40e0; } /* blue */
  #title h1 .c2  { color: #ffd000; } /* yellow */
  #title h1 .c3  { color: #0fb020; } /* green */
  #title h1 .c4  { color: #ff7a10; } /* orange */
  #title h1 .c5  { color: #9010e0; } /* purple */
  #title h1 .c6  { color: #ff2080; } /* hot pink */
  #title h1 .c7  { color: #00b8ff; } /* cyan */
  #title h1 .c8  { color: #70d800; } /* lime */
  #title h1 .c9  { color: #ffaa00; } /* amber */

  /* enter button: classic web-1.0 blue underlined hyperlink, BIG */
  #title button {
    margin-top: 48px; padding: 0;
    background: transparent; border: 0;
    color: #0000ee;
    font-family: 'VT323', monospace;
    font-weight: 400; font-style: normal;
    font-size: 64px; line-height: 1;
    cursor: pointer;
    pointer-events: auto;
    text-decoration: underline;
    text-underline-offset: 6px;
    text-transform: lowercase;
  }
  #title button:hover { color: #551a8b; }
  #title button:active { color: #ff0000; } /* classic active-link red on press */
  #title.gone { opacity: 0; pointer-events: none; }

  /* end overlay */
  #over {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; z-index: 20;
    background: rgba(20,17,13,0.94);
  }
  #over.show { display: flex; }
  #over .place {
    font-family: 'VT323', monospace;
    font-size: 16px; opacity: 0.65;
    color: #ffffff;
    font-style: normal;
  }
  #over .ord {
    font-family: 'Press Start 2P', monospace;
    font-weight: 400; font-style: normal;
    font-size: clamp(40px, 9vw, 72px); line-height: 1; margin-top: 8px;
    color: #ffffff;
    text-transform: lowercase;
  }
  #over .ord.win { color: #ffd000; }
  #over .stat {
    font-family: 'VT323', monospace; font-size: 14px;
    opacity: 0.65; margin-top: 18px;
    font-style: normal;
  }
  #over button {
    margin-top: 26px; padding: 0;
    background: transparent; border: 0;
    color: #0000ee;
    font-family: 'VT323', monospace;
    font-weight: 400; font-style: normal;
    font-size: 20px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-transform: lowercase;
  }
  #over button:hover { color: #551a8b; }
  #over button:active { color: #ff0000; }

  /* virtual joystick — desktop default left, mobile moves right */
  #stick {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 30px);
    left: calc(env(safe-area-inset-left) + 30px);
    width: 130px; height: 130px; z-index: 15;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 50%;
    display: none;
  }
  #stick.on { display: block; }
  #stick-knob {
    position: absolute; top: 50%; left: 50%;
    width: 50px; height: 50px; margin: -25px 0 0 -25px;
    background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.4);
    border-radius: 50%;
  }

  /* hint banner — Times, bright primary red, sits below the HP row */
  #hint {
    position: fixed; top: calc(env(safe-area-inset-top) + 122px); left: 50%; transform: translateX(-50%);
    z-index: 10; pointer-events: none;
    font-family: 'VT323', monospace;
    font-size: 22px; opacity: 0;
    color: #ff1a1a;
    transition: opacity 0.3s;
    font-style: normal;
  }
  #hint.on { opacity: 1; }

  /* ============================================================
     MOBILE — compact layout, joystick on right, no tilt indicator
     ============================================================ */
  @media (max-width: 720px), (pointer: coarse) {
    #hud-bar {
      top: calc(env(safe-area-inset-top) + 50px);
      gap: 12px;
      font-size: 17px;
    }
    #hud-bar .label { font-size: 15px; }
    #hud-bar .val { font-size: 20px; }
    #hud-bar .sep { font-size: 17px; }
    #hud-hp { top: calc(env(safe-area-inset-top) + 10px); gap: 10px; }
    #hud-hp .hp-label { font-size: 15px; }
    .hp-row { gap: 12px; }
    .hp-pip { width: 24px; height: 24px; }

    #tilt { display: none; }

    #stick {
      left: auto;
      bottom: calc(env(safe-area-inset-bottom) + 24px);
      right: calc(env(safe-area-inset-right) + 24px);
      width: 140px; height: 140px;
    }
    #stick-knob { width: 56px; height: 56px; margin: -28px 0 0 -28px; }

    #hint { top: calc(env(safe-area-inset-top) + 100px); font-size: 16px; }

    #title h1 { font-size: clamp(28px, 8vw, 56px); line-height: 1.2; }
    #title button { font-size: 46px; margin-top: 32px; }
    #over .ord { font-size: clamp(36px, 11vw, 60px); }
    #over .place { font-size: 14px; }
    #over .stat { font-size: 13px; }
    #over button { font-size: 18px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>



<!-- Boombox + tape mini-scene: drag tape onto boombox to start
     music, tap a playing boombox to pause and eject the tape. -->
<canvas id="bb-canvas"></canvas>

<div id="hud" class="hud">
  <div id="hud-bar">
    <span class="stat"><span class="label">alive</span> <span class="val" id="alive">10</span><span class="dim"> / 10</span></span>
    <span class="sep">·</span>
    <span class="stat"><span class="label">round</span> <span class="val" id="time">00:00</span></span>
  </div>
  <div id="hud-hp">
    <span class="hp-label">hp</span>
    <div id="hpRow" class="hp-row"></div>
  </div>
</div>

<div id="tilt">
  <div id="tilt-arrow"></div>
  <div id="tilt-label">tilt</div>
</div>

<div id="hint"></div>

<div id="stick"><div id="stick-knob"></div></div>

<div id="title">
  <h1>
    <span class="line line-ten"><span class="c0">t</span><span class="c2">e</span><span class="c1">n</span></span>
    <span class="line line-little"><span class="c3">l</span><span class="c4">i</span><span class="c5">t</span><span class="c6">t</span><span class="c7">l</span><span class="c8">e</span></span>
    <span class="line line-nigas"><span class="c9">n</span><span class="c0">i</span><span class="c3">g</span><span class="c6">a</span><span class="c7">s</span></span>
  </h1>
  <button id="start" style="pointer-events:none;opacity:0.65">loading...</button>
</div>

<div id="over">
  <div class="place">you placed</div>
  <div class="ord" id="ord">3rd</div>
  <div class="stat" id="overStat">survived 00:00</div>
  <button id="again">again</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<!-- Shared simulation modules. Authored to also work in Node so the
     forthcoming Colyseus server can require() the same files. -->
<script src="./sim/cfg.js"></script>
<script src="./sim/shapes.js"></script>
<script src="./sim/rng.js"></script>
<script src="./sim/util.js"></script>
<script src="./sim/state.js"></script>
<script src="./sim/figures.js"></script>
<script src="./sim/hand.js"></script>
<script>
// Mobile dev console: append #debug to the URL to load eruda, which
// gives a floating console UI on the page so we can read logs and
// errors without a desktop dev tools connection.
if (location.hash.includes('debug')) {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/eruda';
  s.onload = () => { try { eruda.init(); console.log('[eruda] loaded'); } catch (e) {} };
  document.head.appendChild(s);
}
</script>
<script>
'use strict';

// ============================================================
// MUSIC — HTML5 <audio>. Self-hosted mp3 in the repo. iOS Safari
// handles this reliably under a user gesture. Drop one or more
// URLs (relative paths or absolute) into MIX_URLS — when a mix
// ends, a random one is picked next. Volume sits low so the music
// is background, not foreground.
// ============================================================
const MIX_URLS = [
  './mix.mp3',
];
const MAX_RANDOM_START_RATIO = 0.6;
const AUDIO_VOLUME = 0.35;       // 0..1

let audioElement = null;
let audioStarted = false;

function pickRandomMix() {
  if (MIX_URLS.length === 0) return null;
  return MIX_URLS[Math.floor(Math.random() * MIX_URLS.length)];
}

// Set audio.currentTime to a fresh random spot in the first
// MAX_RANDOM_START_RATIO of the track. Logs both the target and the
// post-seek value so we can verify in eruda whether the seek stuck.
function seekToRandomStart() {
  if (!audioElement) return;
  const dur = audioElement.duration;
  if (!isFinite(dur) || dur < 1) {
    console.log('[audio] seek skipped — no duration yet');
    return;
  }
  const target = Math.random() * dur * MAX_RANDOM_START_RATIO;
  const before = audioElement.currentTime;
  audioElement.currentTime = target;
  console.log('[audio] seek → target', target.toFixed(1), 'from', before.toFixed(1));
  // Confirm post-seek (browsers sometimes clamp or revert).
  setTimeout(() => {
    if (audioElement) {
      console.log('[audio] after-seek currentTime:', audioElement.currentTime.toFixed(1));
    }
  }, 250);
}

// Enter button enables as soon as the character GLB is ready.
// Music isn't tied to Enter — the user starts it by dragging the
// tape onto the boombox.
function maybeEnableEnter() {
  if (!runnerLoaded) return;
  const btn = document.getElementById('start');
  if (btn) {
    btn.textContent = 'enter';
    btn.style.pointerEvents = 'auto';
    btn.style.opacity = '';
  }
}

function initAudio() {
  audioElement = new Audio();
  audioElement.src = pickRandomMix() || '';
  audioElement.preload = 'auto';
  audioElement.volume = AUDIO_VOLUME;
  audioElement.loop = false;
  // iOS playsinline hints — needed for some embedded contexts.
  audioElement.setAttribute('playsinline', '');
  audioElement.setAttribute('webkit-playsinline', '');
  audioElement.addEventListener('loadedmetadata', () => {
    console.log('[audio] metadata loaded, duration:', audioElement.duration.toFixed(1));
  });
  audioElement.addEventListener('playing', () => {
    console.log('[audio] playing');
  });
  audioElement.addEventListener('seeked', () => {
    console.log('[audio] seeked → currentTime', audioElement.currentTime.toFixed(1));
  });
  audioElement.addEventListener('error', (e) => {
    console.warn('[audio] error', e, audioElement.error && audioElement.error.message);
  });
  audioElement.addEventListener('ended', () => {
    // Loop with a new random mix and a fresh random start point.
    audioElement.src = pickRandomMix() || '';
    audioElement.addEventListener('loadedmetadata', () => {
      seekToRandomStart();
      audioElement.play().catch((err) => console.warn('[audio] replay failed', err));
    }, { once: true });
  });
}

// iOS audio preflight. On a fresh page load, iOS's media-engagement
// heuristic rejects the very first audio.play() — even inside a user
// gesture — but it marks the element as "attempted" so the SECOND
// play() call goes through. Run a silent preflight (muted play +
// immediate pause) on the user's first interaction anywhere on the
// page so the user's actual tape-drop is already the second call.
let audioPreflighted = false;
function preflightAudio() {
  if (audioPreflighted || !audioElement) return;
  audioPreflighted = true;
  audioElement.muted = true;
  const p = audioElement.play();
  if (p && p.then) {
    p.then(() => {
      audioElement.pause();
      audioElement.muted = false;
      console.log('[audio] preflight succeeded');
    }).catch((err) => {
      audioElement.muted = false;
      console.log('[audio] preflight rejected (expected on iOS):', err.message);
    });
  } else {
    audioElement.muted = false;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  initAudio();
  initBoombox();
  // First pointerdown anywhere — Enter, joystick, tape, anywhere —
  // runs the preflight once.
  document.addEventListener('pointerdown', preflightAudio, { once: true, capture: true });
});

// Public hooks the boombox scene calls when the tape lands or the
// user taps the playing deck.
function bbStartMusic() {
  console.log('[bb] startMusic, audioStarted=', audioStarted);
  if (!audioElement) initAudio();
  if (!audioElement) return;
  // play() must be the only media-state call in this gesture frame.
  // iOS rejects play() if setters preceded it. Seek runs AFTER play
  // resolves — at that point the audio is actively playing and iOS
  // will honor the seek. There's a fraction-of-a-second of the
  // previous position audible before the jump.
  const p = audioElement.play();
  if (p && p.then) {
    p.then(() => {
      console.log('[bb] audio play() succeeded');
      audioStarted = true;
      seekToRandomStart();
    }).catch((err) => {
      console.warn('[bb] audio play() rejected:', err.message || err);
    });
  }
}
function bbStopMusic() {
  if (!audioElement) return;
  audioElement.pause();
}

// ============================================================
// BOOMBOX + TAPE — mini three.js scene, bottom-left corner.
// Drag the tape onto the boombox to start music. Tap a playing
// boombox to pause and eject the tape. Replaces the old mute
// toggle with something you actually want to touch.
// ============================================================
const BB = {
  canvas: null,
  renderer: null,
  scene: null,
  camera: null,
  raycaster: null,
  pointerNDC: { x: 0, y: 0 },
  boombox: null,             // THREE.Group
  tape: null,                // THREE.Group
  tapeHome: new THREE.Vector3(),
  tapeDocked: new THREE.Vector3(),
  // State: 'idle' (tape at home, no music) | 'dragging' (user holds tape)
  //      | 'playing' (tape docked, music plays) | 'returning' (tape tweens home)
  //      | 'docking' (tape tweens into deck) | 'rotatingBox' (user dragging
  //      boombox to rotate it)
  state: 'idle',
  dragPointerId: null,
  dragStartXY: { x: 0, y: 0 },
  dragMoved: false,
  dragPlane: new THREE.Plane(),
  dragGrabOffset: new THREE.Vector3(),
  // Starting rotation captured at the moment a boombox-rotate drag
  // begins, so movement deltas apply on top of the user's current pose.
  boxStartRot: { x: 0, y: 0 },
  tween: null,               // { from, to, t, dur, onDone }
  bobPhase: 0,
  needsRender: true,
};

function initBoombox() {
  const canvas = document.getElementById('bb-canvas');
  if (!canvas) return;
  BB.canvas = canvas;

  BB.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  BB.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  resizeBoombox();

  BB.scene = new THREE.Scene();
  // Cool stage-light fill so the plastic and label colors pop.
  const amb = new THREE.AmbientLight(0xffffff, 0.85);
  BB.scene.add(amb);
  const key = new THREE.DirectionalLight(0xffffff, 1.0);
  key.position.set(2, 3, 4);
  BB.scene.add(key);
  const rim = new THREE.DirectionalLight(0xffd9b0, 0.55);
  rim.position.set(-3, 1, -2);
  BB.scene.add(rim);

  BB.camera = new THREE.PerspectiveCamera(28, canvas.clientWidth / canvas.clientHeight, 0.1, 50);
  BB.camera.position.set(0, 0.4, 6.2);
  BB.camera.lookAt(0, 0, 0);

  BB.raycaster = new THREE.Raycaster();

  // Load both models, then arrange + show. Both GLBs are Draco-
  // compressed, so the loader needs DRACOLoader wired up — the
  // decoder JS/WASM is fetched on demand from jsdelivr.
  const loader = new THREE.GLTFLoader();
  const draco = new THREE.DRACOLoader();
  draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/gltf/');
  loader.setDRACOLoader(draco);
  let loadedBoom = null, loadedTape = null;
  const tryArrange = () => {
    if (!loadedBoom || !loadedTape) return;
    arrangeBoomboxScene(loadedBoom, loadedTape);
    document.body.classList.add('bb-grabbable');
    BB.needsRender = true;
  };
  loader.load('./boombox.glb', (gltf) => { loadedBoom = gltf.scene; tryArrange(); },
    undefined, (err) => console.warn('[bb] boombox load failed', err));
  loader.load('./tape.glb', (gltf) => { loadedTape = gltf.scene; tryArrange(); },
    undefined, (err) => console.warn('[bb] tape load failed', err));

  bindBoomboxPointerEvents();
  window.addEventListener('resize', resizeBoombox);
}

function resizeBoombox() {
  if (!BB.canvas || !BB.renderer) return;
  const w = BB.canvas.clientWidth;
  const h = BB.canvas.clientHeight;
  BB.renderer.setSize(w, h, false);
  if (BB.camera) {
    BB.camera.aspect = w / h;
    BB.camera.updateProjectionMatrix();
  }
  BB.needsRender = true;
}

// Normalize a loaded GLB to a target world height (bounding box).
// Returns a THREE.Group with the model centered at origin, scaled
// so its tallest dimension matches `targetH`.
function normalizeModel(modelRoot, targetH) {
  const box = new THREE.Box3().setFromObject(modelRoot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = targetH / maxDim;

  const wrap = new THREE.Group();
  modelRoot.position.sub(center);          // center on origin
  modelRoot.scale.setScalar(scale);
  modelRoot.position.multiplyScalar(scale);
  wrap.add(modelRoot);
  return wrap;
}

// Build an outline-style glow that follows the object's silhouette:
// clone the normalized model, override every mesh's material to a
// transparent additive BackSide material, scale up slightly. When
// rendered with the original on top, only the outline rim is visible
// past the original's edges — gives the impression of a halo that
// hugs the model shape, instead of a circular sprite blob.
function buildOutline(wrapper, color, scaleFactor) {
  // wrapper.children[0] is the normalized modelRoot from normalizeModel.
  const outline = wrapper.children[0].clone(true);
  const materials = [];
  outline.traverse((child) => {
    if (child.isMesh) {
      const mat = new THREE.MeshBasicMaterial({
        color: color,
        side: THREE.BackSide,
        transparent: true,
        opacity: 0,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      child.material = mat;
      materials.push(mat);
    }
  });
  outline.scale.multiplyScalar(scaleFactor);
  outline.userData.outlineMaterials = materials;
  return outline;
}

function setOutlineOpacity(outline, opacity) {
  if (!outline) return;
  for (const mat of outline.userData.outlineMaterials) {
    mat.opacity = opacity;
  }
}

function arrangeBoomboxScene(boomboxGLB, tapeGLB) {
  // Boombox: bigger of the two. Tape: oversized vs reality so it's
  // an easy grab target on a phone.
  BB.boombox = normalizeModel(boomboxGLB, 1.6);
  BB.tape = normalizeModel(tapeGLB, 0.95);

  // Position: both objects shifted left so the tape never hovers
  // over the joystick area / right-side controls.
  BB.boombox.position.set(-1.10, -0.05, 0);
  // Subtle 3/4 angle on the boombox so the deck face is visible.
  BB.boombox.rotation.y = 0.28;

  BB.tapeHome.set(0.35, 0.05, 0.25);
  // "Docked" pose: tucked into the deck, slightly behind boombox front.
  BB.tapeDocked.set(-1.10, -0.05, -0.15);

  BB.tape.position.copy(BB.tapeHome);
  BB.tape.rotation.y = -0.18;

  // Outline glows: follow the actual model silhouette. tapeGlow is
  // visible while idle/dragging (telegraphs "grab me"); boomboxGlow
  // while playing or rotating (telegraphs interactivity).
  BB.tapeOutline = buildOutline(BB.tape, 0xffcc60, 1.05);
  BB.tape.add(BB.tapeOutline);

  BB.boomboxOutline = buildOutline(BB.boombox, 0xffcc60, 1.04);
  BB.boombox.add(BB.boomboxOutline);

  BB.scene.add(BB.boombox);
  BB.scene.add(BB.tape);
}

function pointerToNDC(clientX, clientY) {
  const rect = BB.canvas.getBoundingClientRect();
  BB.pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  BB.pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
}

function raycastHit(target) {
  if (!target) return null;
  BB.raycaster.setFromCamera(BB.pointerNDC, BB.camera);
  const hits = BB.raycaster.intersectObject(target, true);
  return hits.length ? hits[0] : null;
}

function pointerInsideCanvas(clientX, clientY) {
  const rect = BB.canvas.getBoundingClientRect();
  return (
    clientX >= rect.left && clientX <= rect.right &&
    clientY >= rect.top && clientY <= rect.bottom
  );
}

function bindBoomboxPointerEvents() {
  // Pointer events listen at DOCUMENT level (capture phase). The
  // canvas itself is pointer-events: none — that way empty canvas
  // areas don't block touches meant for the joystick or other UI.
  // We only call stopPropagation when we actually hit the tape /
  // boombox; otherwise we silently let the event reach its real
  // target.

  document.addEventListener('pointerdown', (e) => {
    if (!BB.boombox || !BB.tape) return;
    if (!pointerInsideCanvas(e.clientX, e.clientY)) return;
    pointerToNDC(e.clientX, e.clientY);

    // First check: did the user grab the tape? (Only when idle.)
    if (BB.state === 'idle') {
      const hit = raycastHit(BB.tape);
      if (hit) {
        BB.state = 'dragging';
        BB.dragPointerId = e.pointerId;
        BB.dragStartXY = { x: e.clientX, y: e.clientY };
        BB.dragMoved = false;
        const camDir = new THREE.Vector3();
        BB.camera.getWorldDirection(camDir);
        BB.dragPlane.setFromNormalAndCoplanarPoint(camDir, BB.tape.position);
        BB.dragGrabOffset.copy(BB.tape.position).sub(hit.point);
        document.body.classList.add('bb-grabbing');
        e.preventDefault();
        e.stopPropagation();
        return;
      }
    }

    // Second check: did the user tap the playing boombox?
    if (BB.state === 'playing') {
      const hit = raycastHit(BB.boombox);
      if (hit) {
        BB.dragPointerId = e.pointerId;
        BB.dragStartXY = { x: e.clientX, y: e.clientY };
        BB.dragMoved = false;
        e.preventDefault();
        e.stopPropagation();
        return;
      }
    }

    // Third check: drag-to-rotate the boombox while idle. Lets the
    // user spin the deck around like a 3D model viewer for fun.
    if (BB.state === 'idle') {
      const hit = raycastHit(BB.boombox);
      if (hit) {
        BB.state = 'rotatingBox';
        BB.dragPointerId = e.pointerId;
        BB.dragStartXY = { x: e.clientX, y: e.clientY };
        BB.dragMoved = false;
        BB.boxStartRot.x = BB.boombox.rotation.x;
        BB.boxStartRot.y = BB.boombox.rotation.y;
        document.body.classList.add('bb-grabbing');
        e.preventDefault();
        e.stopPropagation();
      }
    }
  }, { capture: true });

  document.addEventListener('pointermove', (e) => {
    if (e.pointerId !== BB.dragPointerId) return;

    if (BB.state === 'dragging') {
      pointerToNDC(e.clientX, e.clientY);
      BB.raycaster.setFromCamera(BB.pointerNDC, BB.camera);
      const hitPoint = new THREE.Vector3();
      if (BB.raycaster.ray.intersectPlane(BB.dragPlane, hitPoint)) {
        hitPoint.add(BB.dragGrabOffset);
        BB.tape.position.copy(hitPoint);
        BB.needsRender = true;
      }
      if (Math.abs(e.clientX - BB.dragStartXY.x) > 4 ||
          Math.abs(e.clientY - BB.dragStartXY.y) > 4) {
        BB.dragMoved = true;
      }
      e.preventDefault();
      e.stopPropagation();
      return;
    }

    if (BB.state === 'rotatingBox') {
      const dx = e.clientX - BB.dragStartXY.x;
      const dy = e.clientY - BB.dragStartXY.y;
      // 0.01 rad/px feels right for a phone-sized canvas — drag
      // across the canvas ≈ full rotation. Clamp X so the boombox
      // doesn't flip upside down (looks weird with the bottom face
      // facing the camera).
      BB.boombox.rotation.y = BB.boxStartRot.y + dx * 0.01;
      BB.boombox.rotation.x = Math.max(-0.5, Math.min(0.5, BB.boxStartRot.x + dy * 0.01));
      BB.needsRender = true;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) BB.dragMoved = true;
      e.preventDefault();
      e.stopPropagation();
    }
  }, { capture: true });

  const finishPointer = (e) => {
    if (e.pointerId !== BB.dragPointerId) return;
    document.body.classList.remove('bb-grabbing');

    if (!BB.dragMoved) {
      if (BB.state === 'playing') {
        pointerToNDC(e.clientX, e.clientY);
        if (raycastHit(BB.boombox)) {
          ejectTape();
        }
      } else if (BB.state === 'dragging') {
        BB.state = 'idle';
      } else if (BB.state === 'rotatingBox') {
        BB.state = 'idle';
      }
      BB.dragPointerId = null;
      return;
    }

    if (BB.state === 'dragging') {
      pointerToNDC(e.clientX, e.clientY);
      const onBox = raycastHit(BB.boombox);
      if (onBox) {
        dockTape();
      } else {
        returnTapeHome();
      }
    } else if (BB.state === 'rotatingBox') {
      BB.state = 'idle';
    }
    BB.dragPointerId = null;
  };
  document.addEventListener('pointerup', finishPointer, { capture: true });
  document.addEventListener('pointercancel', finishPointer, { capture: true });
}

function dockTape() {
  // Fire the play() call synchronously, while we're still inside
  // the pointerup gesture stack — mobile browsers only unlock audio
  // for play() calls that happen inside the same gesture frame as
  // the user's touch. The visual tween runs in parallel.
  BB.state = 'playing';
  bbStartMusic();
  startTween(BB.tape.position, BB.tapeDocked, 0.35, () => {
    BB.tape.visible = false;
  });
}

function ejectTape() {
  BB.state = 'returning';
  BB.tape.visible = true;
  // Lift out of the deck first, then drift to home.
  const liftPos = new THREE.Vector3(BB.tapeDocked.x, BB.tapeDocked.y + 0.5, BB.tapeDocked.z + 0.4);
  BB.tape.position.copy(liftPos);
  startTween(BB.tape.position, BB.tapeHome, 0.45, () => {
    BB.state = 'idle';
    // (No pre-seek here. With HTML5 audio, setting currentTime
    // outside a play context can cause iOS to reject the subsequent
    // play(). The seek runs in bbStartMusic AFTER play() resolves.)
  });
  bbStopMusic();
}

function returnTapeHome() {
  BB.state = 'returning';
  startTween(BB.tape.position, BB.tapeHome, 0.35, () => {
    BB.state = 'idle';
  });
}

function startTween(targetVec, dest, dur, onDone) {
  BB.tween = {
    from: targetVec.clone(),
    to: dest.clone(),
    target: targetVec,
    t: 0,
    dur: dur,
    onDone: onDone || null,
  };
}

function stepTween(dt) {
  const tw = BB.tween;
  if (!tw) return;
  tw.t = Math.min(1, tw.t + dt / tw.dur);
  const e = tw.t < 0.5
    ? 2 * tw.t * tw.t
    : 1 - Math.pow(-2 * tw.t + 2, 2) / 2;     // ease-in-out quad
  tw.target.lerpVectors(tw.from, tw.to, e);
  BB.needsRender = true;
  if (tw.t >= 1) {
    const done = tw.onDone;
    BB.tween = null;
    if (done) done();
  }
}

function updateBoomboxScene(dt) {
  if (!BB.renderer || !BB.scene || !BB.camera) return;
  if (BB.tween) stepTween(dt);
  // Always advance the phase so glow pulses stay alive even when
  // the tape isn't bobbing.
  BB.bobPhase += dt * 1.6;
  const tSec = performance.now() / 1000;

  // Tape on idle: gentle bob + slow continuous Y-axis spin + slight
  // Z-tilt wobble.
  if (BB.tape && BB.tape.visible && BB.state === 'idle') {
    BB.tape.position.y = BB.tapeHome.y + Math.sin(BB.bobPhase) * 0.04;
    BB.tape.rotation.y += dt * 0.6;
    BB.tape.rotation.z = Math.sin(BB.bobPhase * 0.7) * 0.05;
    BB.needsRender = true;
  }

  // Boombox: slow left-right oscillation around Y, ±45° at 0.4 rad/s
  // (period ~15.7s, max angular velocity ~18°/s — slower than tape's
  // 35°/s spin). Skipped while the user is drag-rotating it. X-tilt
  // smoothly decays back to 0 so a leftover user tilt doesn't linger.
  if (BB.boombox && BB.state !== 'rotatingBox') {
    BB.boombox.rotation.y = Math.sin(tSec * 0.4) * (Math.PI / 4);
    BB.boombox.rotation.x *= Math.pow(0.5, dt * 2);   // half-life ≈ 0.35s
    BB.needsRender = true;
  }

  // Boombox on playing: subtle boom-bamp scale pulse at ~96 BPM.
  // Downbeat hits harder than the offbeat — a soft kick-snare feel.
  if (BB.boombox) {
    if (BB.state === 'playing') {
      const beat = tSec * 1.6;     // 96 BPM
      const phase = beat - Math.floor(beat);
      const downbeat = Math.max(0, Math.cos(phase * Math.PI * 2)) ** 4;
      const offbeat  = Math.max(0, Math.cos((phase - 0.5) * Math.PI * 2)) ** 4;
      const pulse = 1 + 0.04 * downbeat + 0.02 * offbeat;
      BB.boombox.scale.setScalar(pulse);
      BB.needsRender = true;
    } else if (BB.boombox.scale.x !== 1) {
      BB.boombox.scale.setScalar(1);
      BB.needsRender = true;
    }
  }

  // Glow pulse: shows which thing is interactive right now. Tape
  // glows while it's grabbable (idle/dragging); boombox glows while
  // music plays (tap to pause) OR while user is rotating it.
  if (BB.tapeOutline && BB.boomboxOutline) {
    const pulse = 0.30 + 0.35 * (0.5 + 0.5 * Math.sin(BB.bobPhase * 1.6));
    const tapeOn = (BB.state === 'idle' || BB.state === 'dragging');
    const boxOn  = (BB.state === 'playing' || BB.state === 'rotatingBox');
    setOutlineOpacity(BB.tapeOutline,    tapeOn ? pulse : 0);
    setOutlineOpacity(BB.boomboxOutline, boxOn  ? pulse : 0);
    BB.needsRender = true;
  }
  if (BB.needsRender) {
    BB.renderer.render(BB.scene, BB.camera);
    BB.needsRender = false;
  }
}

// ============================================================
// BASKETBALL GLB — supplied model used for the wall + the void
// sphere shapes. Loaded async; until it resolves, the wall renders
// with a procedural canvas-texture sphere (basketballMat below).
// ============================================================
let basketballGlbGeom = null;
let basketballGlbTex = null;
(function loadBasketballGlb() {
  const loader = new THREE.GLTFLoader();
  loader.load('./basketball.glb', (gltf) => {
    let geom = null, tex = null;
    gltf.scene.traverse((node) => {
      if (node.isMesh && !geom) {
        geom = node.geometry;
        if (node.material && node.material.map) tex = node.material.map;
      }
    });
    if (!geom) { console.warn('[basketball.glb] no mesh found'); return; }
    // normalize geometry so bounding-sphere radius = 1, easier scaling
    geom.computeBoundingSphere();
    const r = (geom.boundingSphere && geom.boundingSphere.radius) || 1;
    const norm = geom.clone();
    if (r > 0 && Math.abs(r - 1) > 1e-3) {
      const sm = new THREE.Matrix4().makeScale(1 / r, 1 / r, 1 / r);
      norm.applyMatrix4(sm);
      norm.computeBoundingSphere();
    }
    basketballGlbGeom = norm;
    basketballGlbTex = tex;
    applyBasketballGlbToScene();
    console.log('[basketball.glb] loaded; texture:', !!tex);
  }, undefined, (err) => {
    console.error('[basketball.glb] failed', err);
  });
})();

// Wall + void swap, called once the GLB resolves. Wall balls share
// one Lambert material; void shapes each get a cloned Lambert with
// their own tint.
function applyBasketballGlbToScene() {
  if (!basketballGlbGeom) return;
  // Always use the cleaner procedural texture (basketballTex) — the
  // GLB's bundled texture has very chunky black seams that read as
  // cartoony. Procedural keeps thin warm-brown seams + grain.
  const wallMat = new THREE.MeshLambertMaterial({
    map: basketballTex,
    color: 0xffffff,
  });
  for (const ball of wallCubes) {
    ball.geometry = basketballGlbGeom;
    ball.scale.setScalar(0.7); // match the previous SphereGeometry(0.7) radius
    ball.material = wallMat;
  }
  // Void: swap geom on sphere-tagged entries and rebuild the
  // material with the procedural texture + per-shape tint/opacity.
  for (const g of giantShapes) {
    if (g.glbSwappable) {
      g.mesh.geometry = basketballGlbGeom;
      g.mesh.scale.setScalar(g.glbBaseSize);
    }
    const m = new THREE.MeshLambertMaterial({
      map: basketballTex,
      color: g.tintColor,
      transparent: true,
      opacity: g.baseOpacity,
      side: THREE.DoubleSide,
    });
    g.mesh.material = m;
    g.mat = m;
  }
}

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
// Cinematic tone mapping so the loud club lights don't wash everything out
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.74;

const camTarget = { y: 14, z: 13.5, fov: 42 };
let camInitialized = false;

function fitCameraTarget() {
  const w = window.innerWidth, h = window.innerHeight;
  const aspect = w / h;
  camera.aspect = aspect;
  renderer.setSize(w, h);

  let fov;
  if (aspect < 0.95) {
    const k = Math.min(1, (1 - aspect) / 0.55);
    fov = 42 + k * 22;
  } else {
    fov = 42;
  }
  camTarget.fov = fov;

  const shrinkProgress = (CFG.plateR0 - S.plateR) / Math.max(0.01, (CFG.plateR0 - CFG.shrinkMin));
  const margin = lerp(1.12, 1.00, Math.max(0, Math.min(1, shrinkProgress)));

  const plateD = S.plateR * 2;
  const fovRad = fov * Math.PI / 180;
  const tanHalf = Math.tan(fovRad / 2);
  const projFactor = 0.78;
  const dForHoriz = (plateD * margin) / (2 * tanHalf * aspect);
  const dForVert = (plateD * projFactor * margin) / (2 * tanHalf);
  const d = Math.max(dForHoriz, dForVert);

  const k = d / 19.45;
  camTarget.y = 14 * k;
  camTarget.z = 13.5 * k;
}

function tickCamera(dt) {
  if (!camInitialized) {
    camera.position.set(0, camTarget.y, camTarget.z);
    camera.fov = camTarget.fov;
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    camInitialized = true;
    return;
  }
  const k = 1 - Math.exp(-2.6 * dt);
  camera.position.y += (camTarget.y - camera.position.y) * k;
  camera.position.z += (camTarget.z - camera.position.z) * k;
  camera.fov += (camTarget.fov - camera.fov) * k;
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}

// LIGHT BEAMS — fake volumetric cones of colored light dropping
// from above the plate. Additive blending so they read as glow,
// not solid geometry. Each gently sways on its own phase so the
// room looks like there's an unseen lighting rig working a crowd.
// ============================================================
const lightBeams = [];
function addLightBeam(color, x, z, opts = {}) {
  const apexY = opts.apexY ?? 11.5;
  const baseY = opts.baseY ?? -1.0;
  const radius = opts.radius ?? 1.6;
  const opacity = opts.opacity ?? 0.20;
  const h = apexY - baseY;
  const geo = new THREE.ConeGeometry(radius, h, 28, 1, true);
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(geo, mat);
  // ConeGeometry has apex at +Y, base at -Y by default. Center it so the
  // apex sits at apexY and the base sits at baseY.
  mesh.position.set(x, (apexY + baseY) / 2, z);
  scene.add(mesh);
  lightBeams.push({ mesh, phase: Math.random() * Math.PI * 2, baseOpacity: opacity });
  return mesh;
}

// Procedural basketball texture: classic orange base with the four
// canonical black seam curves. Same texture shared across every ball
// in the wall, with per-ball random rotation so seams aren't lockstep.
function makeBasketballTexture() {
  // Higher-res canvas so the seams stay sharp on bigger balls. Texture
  // is the classic basketball: warm rubbery orange with a subtle radial
  // gradient (soft shadow toward poles when wrapped on a sphere), four
  // thin dark-brown seam lines (not pure black), and a fine grain.
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');

  // base orange with a soft fall-off — looks like leather, not vinyl
  const grad = ctx.createRadialGradient(256, 256, 60, 256, 256, 380);
  grad.addColorStop(0.0, '#d96c20');
  grad.addColorStop(0.6, '#b85518');
  grad.addColorStop(1.0, '#8a3e10');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 512);

  // fine grain — random tiny specks so the surface isn't perfectly smooth
  for (let i = 0; i < 3000; i++) {
    const x = Math.random() * 512;
    const y = Math.random() * 512;
    const a = 0.05 + Math.random() * 0.08;
    ctx.fillStyle = Math.random() < 0.5
      ? `rgba(50, 24, 8, ${a})`
      : `rgba(230, 145, 70, ${a * 0.6})`;
    ctx.fillRect(x, y, 1.5, 1.5);
  }

  // seam lines: thin, dark warm brown (not pure black) — reads as
  // recessed grooves rather than printed-on stripes
  ctx.strokeStyle = '#2a1408';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  // equator + meridian
  ctx.beginPath(); ctx.moveTo(0, 256); ctx.lineTo(512, 256); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(256, 0); ctx.lineTo(256, 512); ctx.stroke();
  // two C-curve seams (the basketball's signature crossing arcs)
  ctx.beginPath(); ctx.ellipse(0, 256, 192, 400, 0, -Math.PI / 2, Math.PI / 2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(512, 256, 192, 400, 0, Math.PI / 2, 3 * Math.PI / 2); ctx.stroke();

  // soft highlight along the top half — adds dimensional read
  const hi = ctx.createRadialGradient(180, 150, 20, 180, 150, 240);
  hi.addColorStop(0, 'rgba(255, 220, 180, 0.30)');
  hi.addColorStop(1, 'rgba(255, 220, 180, 0)');
  ctx.fillStyle = hi;
  ctx.fillRect(0, 0, 512, 512);

  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 4;
  return tex;
}

// CONFETTI EXPLOSION — when the round ends, every wall cube
// launches outward with a tumble and falls into the void.
// ============================================================
const confetti = { active: false, t: 0, cubes: [] };
function explodeRoom() {
  if (confetti.active) return;
  confetti.active = true;
  confetti.t = 0;
  for (const cube of wallCubes) {
    const dx = cube.position.x;
    const dz = cube.position.z;
    const d = Math.max(0.01, Math.hypot(dx, dz));
    // outward + mild upward velocity, randomized. Outward-dominant so
    // cubes clear the play area fast and don't crowd the camera.
    const outSpeed = 6 + Math.random() * 6;
    const upSpeed  = 1.5 + Math.random() * 4;
    confetti.cubes.push({
      mesh: cube,
      vx: (dx / d) * outSpeed + (Math.random() - 0.5) * 3,
      vy: upSpeed,
      vz: (dz / d) * outSpeed + (Math.random() - 0.5) * 3,
      rx: (Math.random() - 0.5) * 6,
      ry: (Math.random() - 0.5) * 6,
      rz: (Math.random() - 0.5) * 6,
    });
  }
}
function tickConfetti(dt) {
  if (!confetti.active) return;
  confetti.t += dt;
  const g = 14; // gravity
  for (const c of confetti.cubes) {
    if (!c.mesh.visible) continue;
    c.vy -= g * dt;
    c.mesh.position.x += c.vx * dt;
    c.mesh.position.y += c.vy * dt;
    c.mesh.position.z += c.vz * dt;
    c.mesh.rotation.x += c.rx * dt;
    c.mesh.rotation.y += c.ry * dt;
    c.mesh.rotation.z += c.rz * dt;
    // once a cube has fallen well past the tunnel, hide it so we
    // stop integrating it. The pieces are gone visually anyway.
    if (c.mesh.position.y < -50) c.mesh.visible = false;
  }
}

// PSYCHEDELIC TUNNEL — rings + giant wireframe shapes descend from

// own axes / phase so the void below reads as alive and chaotic.

const tunnelRings = [];

// helper: build a giant primitive (wireframe OR solid filled) at a given depth
function giantGeom(type, size) {
  switch (type) {
    case 'cube':        return new THREE.BoxGeometry(size, size, size);
    case 'sphere':      return new THREE.SphereGeometry(size, 22, 14);
    case 'cone':        return new THREE.ConeGeometry(size, size * 1.7, 22);
    case 'octahedron':  return new THREE.OctahedronGeometry(size, 0);
    case 'pyramid':     return new THREE.ConeGeometry(size, size * 1.4, 4);
    case 'icosahedron': return new THREE.IcosahedronGeometry(size, 0);
    case 'torusKnot':   return new THREE.TorusKnotGeometry(size * 0.7, size * 0.18, 64, 10);
    case 'dodecahedron':return new THREE.DodecahedronGeometry(size, 0);
    case 'torus':       return new THREE.TorusGeometry(size, size * 0.30, 14, 36);
    default:            return new THREE.BoxGeometry(size, size, size);
  }
}

function addGiantShape(type, size, y, opts = {}) {
  // Basketball cascade: every giant shape wears the basketball texture
  // (black seams). Material color multiplies the texture so each shape
  // can be tinted with a different palette primary — the orange basket-
  // ball becomes a red / blue / green / etc basketball.
  const geom = giantGeom(type, size);
  const mat = new THREE.MeshLambertMaterial({
    map: basketballTex,
    color: opts.color ?? 0xffffff,
    transparent: true, opacity: opts.opacity ?? 0.75,
    side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(opts.x || 0, y, opts.z || 0);
  // random initial orientation so seams don't all align
  mesh.rotation.set(
    Math.random() * Math.PI * 2,
    Math.random() * Math.PI * 2,
    Math.random() * Math.PI * 2,
  );
  (opts.parent || scene).add(mesh);
  giantShapes.push({
    mesh,
    mat,
    baseOpacity: mat.opacity,
    tintColor: opts.color ?? 0xffffff,
    glbSwappable: (type === 'sphere'),
    glbBaseSize: size,
    spin: {
      x: (Math.random() * 0.6 + 0.10) * (Math.random() < 0.5 ? -1 : 1),
      y: (Math.random() * 0.6 + 0.10) * (Math.random() < 0.5 ? -1 : 1),
      z: (Math.random() * 0.6 + 0.10) * (Math.random() < 0.5 ? -1 : 1),
    },
    phase: Math.random() * Math.PI * 2,
  });
}

// ============================================================
// DISCO BALL — hangs above the plate, tumbles on all three axes.
// Anchored to scene (not plateGroup) so the cable stays vertical
// while the plate tilts. Texture-mapped mirror tile grid so the
// rotation is actually legible — a smooth sphere can't show spin.
// ============================================================
// disco ball loaded from disco.glb. We create an empty group up front
// so the animation tick can already rotate "the ball" before the GLB
// resolves; the loaded model is mounted inside on load. We auto-scale
// to a target diameter and recenter so rotation tumbles around its own
// middle, not whatever origin the modeler exported with.
const DISCO_TARGET_DIAMETER = 2.0;  // world units across — tweak to taste

let discoBall = null;
{
  const cable = new THREE.Mesh(
    new THREE.CylinderGeometry(0.018, 0.018, 8, 6),
    new THREE.MeshBasicMaterial({ color: 0x0a0a0a }),
  );
  cable.position.set(0, 10, 0);
  scene.add(cable);

  const ballRoot = new THREE.Group();
  ballRoot.position.set(0, 6.2, 0);
  scene.add(ballRoot);
  discoBall = ballRoot;

  // warm under-glow point light from the ball
  const discoGlow = new THREE.PointLight(0xfff4d8, 0.40, 11, 2);
  discoGlow.position.set(0, 6.0, 0);
  scene.add(discoGlow);

  const loader = new THREE.GLTFLoader();
  loader.load('./disco.glb', (gltf) => {
    const model = gltf.scene;

    // auto-scale to a target diameter
    let bbox = new THREE.Box3().setFromObject(model);
    const size = bbox.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    if (maxDim > 0) model.scale.setScalar(DISCO_TARGET_DIAMETER / maxDim);

    // recenter so rotation tumbles around the model's geometric center
    bbox = new THREE.Box3().setFromObject(model);
    const center = bbox.getCenter(new THREE.Vector3());
    model.position.sub(center);

    // Replace the GLB's bundled materials with a known-bright silver
    // mirror so the ball reads as a real disco ball rather than the
    // dark gold tint the export came with.
    // Replace the GLB's bundled materials with a known-good mirror.
    // Also strip any lights baked into the model — Blender often
    // exports scene lights along with the geometry, and those would
    // dump extra brightness exactly at the ball's position.
    const mirrorMat = new THREE.MeshStandardMaterial({
      color: 0xd8d8d8,
      emissive: 0xcccccc, emissiveIntensity: 0.10,
      metalness: 1.0, roughness: 0.14,
    });
    let foundLights = 0;
    model.traverse((node) => {
      if (node.isMesh) {
        node.castShadow = false;
        node.material = mirrorMat;
      }
      if (node.isLight) {
        // Disable the light but leave it in place — some exporters
        // nest the geometry under a light node, so detaching would
        // take the ball with it.
        foundLights++;
        node.intensity = 0;
        node.visible = false;
      }
    });
    if (foundLights > 0) console.log('[disco.glb] disabled', foundLights, 'baked light(s)');

    ballRoot.add(model);
  }, undefined, (err) => {
    console.error('[disco.glb] failed to load', err);
    // procedural fallback so the scene still has a ball visible
    const fallback = new THREE.Mesh(
      new THREE.SphereGeometry(0.95, 32, 22),
      new THREE.MeshStandardMaterial({
        color: 0xeeeeee, roughness: 0.10, metalness: 1.0,
        emissive: 0x222222, emissiveIntensity: 0.30,
      }),
    );
    ballRoot.add(fallback);
  });
}
